[tools]
terraform = "1.16.1"
tflint = "0.64.0"
terraform-docs = "0.24.0"

[tasks.check]
description = "fmt, validate, tflint and terraform test for the root module and every module under modules/"
run = '''
set -euo pipefail
terraform fmt -check -recursive
for module_dir in . modules/*/; do
  echo "== ${module_dir}"
  terraform -chdir="${module_dir}" init -backend=false -input=false >/dev/null
  terraform -chdir="${module_dir}" validate
  tflint --chdir="${module_dir}" --config="$PWD/.tflint.hcl"
  terraform -chdir="${module_dir}" test
done
'''
