name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shortpoet-cloud/.github/actions/terraform-module-check@v0.1.0-rc.3
        with:
          # backup_bucket sources the private tf-iam repository.
          module-source-token: ${{ secrets.SHORTPOET_CLOUD_MODULE_READ_TOKEN }}
